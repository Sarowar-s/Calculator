<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Makes the website responsive on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website</title>

    <style>
        /* Basic page styling */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        /* Header */
        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        /* Main content */
        main {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            text-align: center;
        }

        h1 {
            font-size: 40px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        /* Button */
        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .button:hover {
            background: #0056b3;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            color: #666;
        }
    </style>
</head>

<body>

    <header>
        <h2>My Website</h2>
    </header>

    <main>
        <h1>Hello, World! 👋</h1>

        <p>
            Welcome to my website.
            This website is hosted using GitHub Pages.
        </p>

        <a class="button" href="https://github.com/" target="_blank">
            Visit GitHub
        </a>
    </main>

    <footer>
        © 2026 My Website
    </footer>

</body>

</html>
